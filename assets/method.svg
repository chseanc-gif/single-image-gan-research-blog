<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Combined-mapping adaptation</title><desc id="desc">Random latent z enters learned and frozen mappings. Learned elementwise coefficients a and b blend the style vectors. Frozen synthesis creates the image.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#83908a"/></marker></defs>
<rect width="1000" height="390" fill="white"/>
<g font-family="Arial,sans-serif" fill="#202b2b"><text x="32" y="40" font-size="14" fill="#64706d" letter-spacing="2">THE GENERATOR</text>
<g fill="none" stroke="#83908a" stroke-width="2" marker-end="url(#arrow)"><path d="M130 188H170V112H215"/><path d="M170 188V268H215"/><path d="M425 112H470"/><path d="M425 268H470"/><path d="M520 112H566V188H608"/><path d="M520 268H566V188"/><path d="M664 188H720"/><path d="M895 188H940"/></g>
<circle cx="95" cy="188" r="35" fill="#f0efe8"/><text x="95" y="198" text-anchor="middle" font-size="29" font-family="Georgia,serif" font-style="italic">z</text><text x="95" y="244" text-anchor="middle" font-size="14" fill="#64706d">random input</text>
<rect x="215" y="73" width="210" height="78" rx="5" fill="#f9eee9" stroke="#a73d30"/><text x="320" y="106" text-anchor="middle" font-size="18">Learned mapping f<tspan baseline-shift="sub" font-size="12">θ</tspan></text><text x="320" y="132" text-anchor="middle" font-size="12" fill="#a73d30" letter-spacing="1">TRAINABLE</text>
<rect x="215" y="229" width="210" height="78" rx="5" fill="#f0f1ec" stroke="#9ba89d"/><text x="320" y="262" text-anchor="middle" font-size="18">Source mapping f<tspan baseline-shift="sub" font-size="12">0</tspan></text><text x="320" y="288" text-anchor="middle" font-size="12" fill="#64706d" letter-spacing="1">FROZEN</text>
<circle cx="495" cy="112" r="25" fill="#f9eee9" stroke="#a73d30"/><text x="495" y="119" text-anchor="middle" font-size="22">a ⊙</text><circle cx="495" cy="268" r="25" fill="#f9eee9" stroke="#a73d30"/><text x="495" y="275" text-anchor="middle" font-size="22">b ⊙</text>
<circle cx="636" cy="188" r="28" fill="#fff" stroke="#83908a"/><text x="636" y="197" text-anchor="middle" font-size="29">+</text><text x="636" y="245" text-anchor="middle" font-size="14" fill="#64706d">adapted style</text>
<rect x="720" y="145" width="175" height="86" rx="5" fill="#f0f1ec" stroke="#9ba89d"/><text x="807" y="179" text-anchor="middle" font-size="18">Synthesis S<tspan baseline-shift="sub" font-size="12">0</tspan></text><text x="807" y="206" text-anchor="middle" font-size="12" fill="#64706d" letter-spacing="1">FROZEN</text>
<text x="957" y="197" text-anchor="middle" font-size="26" font-family="Georgia,serif" font-style="italic">x</text><text x="945" y="249" text-anchor="middle" font-size="14" fill="#64706d">image</text>
<text x="320" y="355" text-anchor="middle" font-size="13" fill="#64706d">Both mappings receive the same random input.</text><text x="732" y="355" text-anchor="middle" font-size="13" fill="#64706d">a and b are learned vectors, not scalar probabilities.</text>
</g></svg>
